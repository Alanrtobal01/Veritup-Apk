name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install

      - name: Crear proyecto Android
        run: |
          npx cap add android

      - name: Poner ícono de la app
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor "#0A1A24" --iconBackgroundColorDark "#0A1A24" --splashBackgroundColor "#0A1A24" --splashBackgroundColorDark "#0A1A24"

      - name: Copiar la web a la app
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../veritup-demo.apk

      - name: Guardar APK en el resumen de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: veritup-demo-apk
          path: veritup-demo.apk

      - name: Publicar en Releases (link fijo de descarga)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo
          name: Veritup Demo (versión de prueba)
          body: Maqueta de demostración. Montos ficticios, pagos simulados.
          files: veritup-demo.apk
          make_latest: true
