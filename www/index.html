<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Veritup">
<title>Veritup</title>
<style>
:root{
  --noche:#0A1A24;--prof:#11293A;--linea:#1E3A4D;--borde:#2A4A5E;--alza:#2BD98F;--alza-osc:#123D2E;
  --ambar:#F2B33D;--ambar-osc:#3D3214;--niebla:#F4F7F6;--bruma:#8FA3AE;--suave:#C5D2D8;--baja:#FF6B6B;--baja-osc:#3D1A1C;
  --titulo:"Sora","Segoe UI",Roboto,system-ui,sans-serif;--texto:"Inter",Roboto,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--noche);color:var(--niebla);font-family:var(--texto);font-size:17px;line-height:1.45}
a{color:var(--alza)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.demo{background:var(--ambar);color:var(--noche);font-size:13px;font-weight:700;text-align:center;padding:6px 12px;letter-spacing:.02em}
.pant{flex:1;padding:24px 20px 28px;display:flex;flex-direction:column;gap:20px}
.fila{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:6px}
.h1{margin:0;font-family:var(--titulo);font-size:30px;font-weight:700;letter-spacing:-.02em}
.h2{margin:0;font-family:var(--titulo);font-size:21px;font-weight:700}
.sub{margin:0;color:var(--bruma);font-size:16px}
.chica{font-size:14px;color:var(--bruma);line-height:1.5}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--titulo);font-size:26px;font-weight:700;letter-spacing:-.02em}
.tarjeta{background:var(--prof);border-radius:20px;padding:18px}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;border:1px solid var(--linea);font-size:15px;color:var(--suave)}
.aviso svg,.fila>svg{flex-shrink:0}
.aviso.ambar{background:#2B2410;border-color:#5C4A1A;color:#F4E3BE}
.btn{min-height:56px;border:0;border-radius:16px;background:var(--alza);color:var(--noche);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;padding:0 16px;width:100%}
.btn.sec{background:transparent;border:1px solid var(--borde);color:var(--niebla)}
.btn.peligro{background:transparent;border:1px solid #5C2A2A;color:#FF8A8A}
.btn[disabled]{background:var(--linea);color:#6F8590;cursor:not-allowed}
.redondo{width:48px;height:48px;border-radius:999px;border:1px solid var(--borde);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0}
label.et{font-size:16px;font-weight:600}
.campo{height:58px;width:100%;padding:0 16px;border-radius:14px;border:1px solid var(--borde);background:var(--prof);color:var(--niebla);font-size:19px;outline:none}
.campo:focus{border-color:var(--alza)}
.campo::placeholder{color:#6F8590}
select.campo{width:auto;padding:0 10px;font-size:17px;font-weight:600}
.err{color:#FF8A8A;font-size:14px;min-height:0}
.pastilla{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600}
.p-verde{background:var(--alza-osc);color:var(--alza)}.p-ambar{background:var(--ambar-osc);color:var(--ambar)}.p-rojo{background:var(--baja-osc);color:#FF8A8A}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:6px;border-radius:16px;background:var(--prof)}
.tabs button{height:46px;border:0;border-radius:12px;background:transparent;color:var(--suave);font-size:16px;font-weight:600}
.tabs button.on{background:var(--alza);color:var(--noche)}
.opcion{text-align:left;width:100%;padding:16px;border-radius:18px;background:var(--prof);border:2px solid var(--borde);display:flex;gap:14px;align-items:center}
.opcion.on{border-color:var(--alza)}
.radio{width:24px;height:24px;flex-shrink:0;border-radius:999px;border:2px solid var(--borde);display:flex;align-items:center;justify-content:center}
.opcion.on .radio{border-color:var(--alza)}
.opcion.on .radio::after{content:"";width:12px;height:12px;border-radius:999px;background:var(--alza)}
.num{font-family:var(--titulo);font-weight:700;font-variant-numeric:tabular-nums}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--linea);background:var(--noche)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:13px;text-decoration:none;color:var(--bruma)}
.nav a.on{color:var(--alza);font-weight:600}
.plan{border-radius:22px;background:var(--prof);border:2px solid var(--prof);overflow:hidden}
.plan.actual{border-color:var(--alza)}
.plan.futuro{border:2px dashed #4A5B65;opacity:.5}
.plan>button{width:100%;padding:14px 16px;border:0;background:transparent;display:flex;align-items:center;gap:14px;text-align:left}
.insignia{width:52px;height:52px;flex-shrink:0;border-radius:16px;color:var(--noche);display:flex;align-items:center;justify-content:center;font-family:var(--titulo);font-size:22px;font-weight:700}
.lista{border-radius:20px;background:var(--prof);overflow:hidden}
.item{padding:16px;display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--linea)}
.item:last-child{border-bottom:0}
.vinculo{min-height:62px;padding:0 16px;display:flex;align-items:center;gap:14px;border:0;border-bottom:1px solid var(--linea);background:transparent;width:100%;text-align:left;font-size:18px;text-decoration:none;color:var(--niebla)}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.semana div{height:60px;border-radius:14px;background:var(--prof);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--bruma);border:2px solid var(--prof)}
.semana div small{font-size:11px;font-weight:600}
.semana .hoy{background:var(--alza-osc);border-color:var(--alza);color:var(--alza)}
.semana .sab{background:var(--ambar-osc);border-color:var(--ambar);color:var(--ambar)}
.barra{display:flex;height:12px;border-radius:999px;overflow:hidden}
.drop{min-height:160px;padding:20px;border-radius:18px;border:2px dashed var(--borde);background:#0E2230;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer}
.oculto{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--niebla);color:var(--noche);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;z-index:9;max-width:90%;text-align:center}
.pasos{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.pasos li{display:flex;gap:14px;align-items:flex-start}
.pasos .n{width:32px;height:32px;flex-shrink:0;border-radius:999px;background:var(--linea);display:flex;align-items:center;justify-content:center;font-weight:700}
.pasos span:last-child{padding-top:4px}
.grafico{display:flex;align-items:flex-end;gap:8px;height:72px}
.grafico div{flex:1;border-radius:6px}

/* ===== Animaciones (inspiración iOS) ===== */
:root{--resorte:cubic-bezier(.32,.72,0,1);--suave:cubic-bezier(.25,.1,.25,1);--glow:43,217,143}
.btn,.tarjeta,.plan,.opcion,.item,.vinculo,.nav a,.tabs button,.redondo,.drop,.semana div,.lista,.insignia{
  transition:transform .5s var(--resorte),box-shadow .5s var(--resorte),background-color .3s var(--suave),border-color .3s var(--suave),opacity .3s var(--suave),filter .3s var(--suave)}
.btn,.tarjeta,.opcion,.vinculo,.drop,.plan>button,.redondo{position:relative;overflow:hidden;isolation:isolate}
.btn::after,.tarjeta::after,.opcion::after,.vinculo::after,.drop::after,.plan>button::after,.redondo::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;border-radius:inherit;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 60%);
  opacity:0;transition:opacity .45s var(--suave)}
/* ratón: se eleva, se agranda apenas y resplandece */
@media (hover:hover) and (pointer:fine){
  .btn:not([disabled]):hover{transform:translateY(-2px) scale(1.015);box-shadow:0 12px 32px -12px rgba(var(--glow),.6),0 0 0 1px rgba(var(--glow),.35)}
  .btn.sec:not([disabled]):hover,.btn.peligro:hover{box-shadow:0 12px 32px -14px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.16)}
  .tarjeta:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 20px 44px -20px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06)}
  .plan:not(.futuro):hover{transform:scale(1.015);box-shadow:0 18px 44px -20px rgba(var(--glow),.45),0 0 0 1px rgba(var(--glow),.18)}
  .plan:not(.futuro):hover .insignia{transform:scale(1.08) rotate(-3deg)}
  .opcion:not([disabled]):hover{transform:scale(1.02);border-color:rgba(var(--glow),.65);box-shadow:0 0 0 4px rgba(var(--glow),.10)}
  .lista:hover{box-shadow:0 18px 40px -22px rgba(0,0,0,.7)}
  .vinculo:hover,.item:hover{background:rgba(255,255,255,.035)}
  .nav a:hover{transform:translateY(-2px);color:#F4F7F6}
  .tabs button:not(.on):hover{background:rgba(255,255,255,.06);color:#F4F7F6}
  .redondo:hover{transform:scale(1.08);box-shadow:0 0 0 6px rgba(255,255,255,.05)}
  .drop:hover{transform:scale(1.01);border-color:rgba(var(--glow),.6);box-shadow:0 0 0 6px rgba(var(--glow),.08)}
  :is(.btn,.tarjeta,.opcion,.vinculo,.drop,.plan>button,.redondo):hover::after{opacity:1}
}
/* toque y presión: se hunde como en iOS */
:is(.btn:not([disabled]),.opcion:not([disabled]),.redondo,.tabs button,.vinculo,.plan>button,.nav a,.drop):active{transform:scale(.965);transition-duration:.14s}
.tocado::after{opacity:1!important}
/* selección: pequeño rebote y halo */
.pop{animation:pop .65s var(--resorte)}
@keyframes pop{0%{transform:scale(.95)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
.brillo{animation:pop .65s var(--resorte),halo 1.1s var(--suave)}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(var(--glow),.5)}100%{box-shadow:0 0 0 16px rgba(var(--glow),0)}}
.opcion.on{box-shadow:0 0 0 4px rgba(var(--glow),.14),0 14px 32px -16px rgba(var(--glow),.55)}
.tabs button.on{box-shadow:0 8px 20px -10px rgba(var(--glow),.8)}
.plan.actual{box-shadow:0 0 0 4px rgba(var(--glow),.10)}
.nav a.on svg{filter:drop-shadow(0 0 8px rgba(var(--glow),.65))}
.nav a.on{animation:pop .6s var(--resorte)}
/* entrada de cada pantalla, en cascada */
.pant.entra>*{animation:entra .6s var(--resorte) both}
.pant.entra>*:nth-child(2){animation-delay:.035s}.pant.entra>*:nth-child(3){animation-delay:.07s}
.pant.entra>*:nth-child(4){animation-delay:.105s}.pant.entra>*:nth-child(5){animation-delay:.14s}
.pant.entra>*:nth-child(6){animation-delay:.175s}.pant.entra>*:nth-child(n+7){animation-delay:.21s}
@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
/* el plan se despliega con suavidad */
.plan>.col{animation:despliega .5s var(--resorte) both}
@keyframes despliega{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* avisos flotantes con resorte */
.toast{animation:toastIn .55s var(--resorte) both;box-shadow:0 16px 40px -12px rgba(0,0,0,.55);backdrop-filter:blur(12px)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
/* el día de hoy late suave */
.semana .hoy{animation:latido 2.6s ease-in-out infinite}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(var(--glow),0)}50%{box-shadow:0 0 0 5px rgba(var(--glow),.18)}}
/* barra de navegación translúcida como iOS */
.nav{background:rgba(10,26,36,.78);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


/* ===== Página de inicio ===== */
.logo-btn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:16px;flex-shrink:0;text-decoration:none;transition:transform .5s var(--resorte),box-shadow .5s var(--resorte)}
.logo-btn:active{transform:scale(.92)}
@media (hover:hover){.logo-btn:hover{transform:scale(1.08) rotate(-4deg);box-shadow:0 0 0 6px rgba(43,217,143,.10)}}
.marca{text-decoration:none;color:inherit}
.hero{position:relative;gap:18px;padding:8px 0 4px}
.hero::before{content:"";position:absolute;inset:-40px -20px auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(43,217,143,.22),transparent 65%);pointer-events:none;z-index:-1;animation:flota 7s ease-in-out infinite}
@keyframes flota{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,14px)}}
.titular{margin:0;font-family:var(--titulo);font-size:clamp(34px,9vw,58px);font-weight:700;line-height:1.04;letter-spacing:-.03em}
.grande{font-size:18px;line-height:1.5;color:#C5D2D8;margin:0;max-width:560px}
.datos3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.datos3 .tarjeta{padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.pasos3{display:grid;grid-template-columns:1fr;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:16px;background:var(--prof)}
@media (min-width:768px){.pasos3{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding-top:24px}.datos3 .tarjeta{padding:20px}}

/* ===== Responsive: celular, tablet y PC ===== */
html{-webkit-text-size-adjust:100%}
body{min-height:100vh}
.pant{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
@media (max-width:360px){.h1{font-size:26px}.btn{font-size:17px}.campo{font-size:17px}}
@media (min-width:768px){
  body{background:radial-gradient(1200px 600px at 50% -10%,#12324A 0%,#0A1A24 60%)}
  #app{max-width:760px}
  .pant{padding:36px 32px 40px;gap:24px}
  .h1{font-size:36px}
  .grid-planes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .nav{width:100%;max-width:760px;margin:0 auto;border-radius:22px 22px 0 0;border:1px solid var(--linea);border-bottom:0}
}
@media (min-width:1100px){
  #app{max-width:1080px}
  .pant{padding:44px 48px 48px}
  .grid-planes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .nav{max-width:560px;margin:0 auto 16px;border-radius:22px;border-bottom:1px solid var(--linea);bottom:16px}
  .toast{bottom:110px}
}


/* ===== Veritup 2.0 ===== */
.nav{grid-template-columns:repeat(5,1fr)}
.nav a{font-size:12px}
.h1-cab{flex:1;min-width:0;font-size:clamp(24px,7vw,30px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.campana{overflow:visible!important}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#FF6B6B;color:#0A1A24;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #0A1A24;animation:pop .6s var(--resorte)}
.badge.estatica{position:static;box-shadow:none;margin-right:4px}
.icono-caja{width:44px;height:44px;flex-shrink:0;border-radius:14px;background:#123D2E;display:flex;align-items:center;justify-content:center}
.mini{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8FA3AE}
.gira{display:flex;transition:transform .45s var(--resorte)}
.linea{height:1px;background:#1E3A4D}
.caja-negra{padding:14px;border-radius:16px;background:#0A1A24}
.cotiz{gap:8px;padding:12px 14px;border-radius:14px;border:1px solid #1E3A4D;font-size:14px;color:#C5D2D8}
.cotiz svg{flex-shrink:0}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio .tarjeta{padding:14px 12px}
.formula{border:1px solid rgba(43,217,143,.3)}
.prefijo{position:absolute;left:16px;top:14px;font-family:var(--titulo);font-size:22px;font-weight:600;color:#8FA3AE}
.chip-btn{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--borde);background:transparent;color:var(--niebla);font-weight:600;font-size:15px;transition:transform .4s var(--resorte),border-color .3s,background-color .3s}
.chip-btn:active{transform:scale(.94)}
@media (hover:hover){.chip-btn:hover{border-color:var(--alza);background:rgba(43,217,143,.08)}}
.sello{gap:10px;padding:12px 14px;border-radius:14px;background:#0F2E24;color:#BFF0D9;font-size:14px}
.sello svg{flex-shrink:0}
.confirma{background:#0A1A24;border:1px solid #2A4A5E}
.confirma-rojo{background:#2A1416;border:1px solid #5C2A2A}
.btn.rojo{background:#FF6B6B;color:#0A1A24}
.btn.oscuro{background:#0A1A24;color:#F4F7F6}
.btn.chico{width:auto;min-height:44px;font-size:15px;padding:0 14px}
.dos .btn.chico{width:100%}
.btn.bloqueado{border:2px dashed #4A5B65;color:#C5D2D8}
.vista-comp{background:#061118;display:flex;justify-content:center}
.vista-comp img{display:block;width:100%;max-height:420px;object-fit:contain}
.corta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leyenda{gap:14px;flex-wrap:wrap;font-size:13px;color:#C5D2D8}
.punto{width:10px;height:10px;border-radius:999px;display:inline-block}
.notif.nueva{background:rgba(43,217,143,.06)}
.punto-nuevo{width:10px;height:10px;border-radius:999px;background:#2BD98F;flex-shrink:0;box-shadow:0 0 10px rgba(43,217,143,.8)}
.tarjeta-ambar{background:#F2B33D;color:#0A1A24;border-radius:24px}
.link-caja{border-radius:16px;background:#0A1A24;color:#F4F7F6;padding:16px}
.plan-grande{width:112px;height:112px;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.icono-app{width:72px;height:72px;border-radius:20px;background:#0A1A24;border:1px solid #1E3A4D;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.despliegue{animation:despliega .5s var(--resorte) both}
.destacada{border:1px solid rgba(43,217,143,.35);background:linear-gradient(180deg,#123D2E 0%,#11293A 100%)}
.cifra{font-size:clamp(17px,5vw,26px);color:#2BD98F;white-space:nowrap}
.pasos .n.verde{background:#123D2E;color:#2BD98F}
.ojo{position:absolute;right:5px;top:5px;width:48px;height:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.insignia{letter-spacing:-.02em}
input[type=date].campo{color-scheme:dark}
.demo{position:sticky;top:0;z-index:20;padding-top:calc(6px + env(safe-area-inset-top))}
.p-azul{background:#1A2B4D;color:#9DBBFF}
.aviso.rojo{background:#2A1416;border-color:#5C2A2A;color:#FFB3B3}
.enlace{background:none;border:0;padding:6px 0;color:var(--alza);font-weight:600;font-size:15px;align-self:flex-end;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.aviso .enlace{display:inline;padding:0;align-self:auto}
.tabs-scroll{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs-scroll button{flex:0 0 auto;padding:0 16px}
.cuenta-tab{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#F2B33D;color:#0A1A24;font-size:12px;font-weight:800;align-items:center;justify-content:center;margin-left:4px}
.area{height:auto;min-height:96px;padding:14px 16px;font-size:17px;line-height:1.45;resize:vertical;font-family:inherit}
.noticia h3{letter-spacing:-.01em}
@media (min-width:1100px){.grid-noticias{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
@media (max-width:480px){.solo-ancho{display:none}}
/* ===== Panel interno del equipo ===== */
body.equipo{background:#0B0F17}
@media (min-width:768px){body.equipo{background:radial-gradient(1000px 500px at 50% -10%,#2A2210 0%,#0B0F17 60%)}}
.pant-equipo{max-width:820px;margin:0 auto;width:100%}
.cab-equipo{justify-content:space-between;padding-bottom:6px;border-bottom:1px solid #2B2616}
.marca-equipo{display:flex;align-items:center;gap:12px}
.sello-equipo{align-self:flex-start;padding:3px 10px;border-radius:999px;background:#3D3214;color:#F2B33D;font-size:11px;font-weight:800;letter-spacing:.12em}
.tarjeta-equipo{border:1px solid #3D3214}
.btn-equipo{background:#F2B33D;color:#0A1A24}
body.equipo .tabs{background:#141A24}
body.equipo .tabs button.on{background:#F2B33D;color:#0A1A24;box-shadow:0 8px 20px -10px rgba(242,179,61,.8)}
body.equipo .tarjeta,body.equipo .lista{background:#141A24}
body.equipo .campo{background:#141A24;border-color:#2A3446}
body.equipo .cuenta-tab{background:#FF6B6B}
.decision{gap:8px}
.btn.aprobar-g{min-height:62px;font-size:19px;font-weight:700;background:#2BD98F;color:#0A1A24;border-radius:18px;box-shadow:0 12px 30px -14px rgba(43,217,143,.85)}
.btn.aprobar-g[disabled]{box-shadow:none}
.btn.rechazo-l{min-height:46px;background:transparent;border:1px solid #5C2A2A;color:#FF8A8A;font-size:16px;font-weight:600}
.chip-btn.on{background:#F2B33D;border-color:#F2B33D;color:#0A1A24}
.trio .num{white-space:nowrap;font-size:clamp(14px,4vw,17px)!important}
.cap-img{border-radius:12px;border:1px solid var(--borde);width:200px;height:60px;flex-shrink:0;background:#E7EEF1}
.captcha .redondo{flex-shrink:0}
#capIn{letter-spacing:.3em;text-transform:uppercase;font-weight:700}
#capIn::placeholder{letter-spacing:0;text-transform:none;font-weight:400}
.desglose{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:14px;background:#0A1A24;border:1px solid var(--linea);font-size:15px;color:#C5D2D8}
button[disabled]{cursor:not-allowed}
.monto-ajusta{font-size:clamp(18px,5.6vw,28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:768px){.trio .tarjeta{padding:18px}}

/* ---------- animaciones ---------- */
(function(){
 var SEL='.btn,.tarjeta,.opcion,.vinculo,.drop,.plan>button,.redondo';
 function brillo(e){var t=e.target.closest&&e.target.closest(SEL);if(!t)return null;var r=t.getBoundingClientRect();t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px');return t;}
 document.addEventListener('pointermove',brillo,{passive:true});
 document.addEventListener('pointerdown',function(e){var t=brillo(e);if(t){t.classList.add('tocado');setTimeout(function(){t.classList.remove('tocado');},320);}
   if(e.pointerType==='touch'&&navigator.vibrate&&e.target.closest('[data-a],a,button'))try{navigator.vibrate(6);}catch(x){}},{passive:true});
 var ultimo=null,ruta=null;
 document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');ultimo=t?{a:t.getAttribute('data-a'),v:t.getAttribute('data-v')}:null;},true);
 window.__post=function(){
  var r=(location.hash||'').split('?')[0];
  if(r!==ruta){ruta=r;var p=document.querySelector('.pant');if(p){p.classList.add('entra');setTimeout(function(){p.classList.remove('entra');},900);}}
  if(ultimo){var sel='[data-a="'+ultimo.a+'"]'+(ultimo.v!=null?'[data-v="'+ultimo.v+'"]':'');var el=null;try{el=document.querySelector(sel);}catch(x){}
   if(el){var cl=el.classList.contains('on')||el.getAttribute('aria-pressed')==='true'||el.getAttribute('aria-expanded')==='true'?'brillo':'pop';el.classList.add(cl);setTimeout(function(){el.classList.remove(cl);},1200);
    var art=el.closest('.plan');if(art&&el.getAttribute('aria-expanded')==='true'){art.classList.add('pop');setTimeout(function(){art.classList.remove('pop');},700);}}
   ultimo=null;}
 };
})();
